services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lsk
      POSTGRES_PASSWORD: lsk-local-only
      POSTGRES_DB: lsk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U lsk -d lsk"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    ports: ["18474:18474"]
    depends_on:
      db: {condition: service_healthy}
  portal:
    image: nginx:alpine
    ports: ["18473:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on: [api]
volumes:
  pgdata:
