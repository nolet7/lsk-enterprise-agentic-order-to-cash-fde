name: CI
on:
  push:
    branches: [main, poc, pilot, production]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/api/requirements.txt
      - run: pytest -q
        working-directory: services/api
        env:
          AUTH_MODE: demo
          DATABASE_URL: sqlite:///./test-ci.db
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m compileall -q services/api/app
