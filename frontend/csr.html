<!doctype html><html><head><meta charset="utf-8"><title>LSK CSR Workbench</title><style>body{font:16px system-ui;max-width:1100px;margin:40px auto;background:#f4f7fa}section{background:white;padding:20px;margin:15px;border-radius:8px}button{padding:10px;background:#254c83;color:white;border:0;border-radius:5px}pre{white-space:pre-wrap}</style></head><body><h1>LSK CSR Workbench — Synthetic</h1><p>Local demo only: bearer demo-csr-a. Pilot signed OIDC requires externally provisioned identity.</p><button onclick="load()">Refresh</button><section><h2>Ticket queue</h2><pre id="tickets"></pre></section><section><h2>Approval queue</h2><pre id="approvals"></pre><input id="id" placeholder="APR-id"><button onclick="decide('approve')">Approve</button><button onclick="decide('reject')">Reject</button></section><section><h2>Audit decisions</h2><pre id="audit"></pre></section><script>let h={'Authorization':'Bearer demo-csr-a','Content-Type':'application/json'};async function get(p,o={}){let r=await fetch('http://localhost:18474'+p,{...o,headers:h});return r.json()}async function load(){for(let name of ['tickets','audit'])document.getElementById(name).textContent=JSON.stringify(await get('/api/'+name),null,2);document.getElementById('approvals').textContent=JSON.stringify(await get('/api/pilot/approvals'),null,2)}async function decide(d){alert(JSON.stringify(await get('/api/pilot/approvals/'+document.getElementById('id').value+'/decision',{method:'POST',body:JSON.stringify({decision:d})})));load()}load()</script></body></html>
