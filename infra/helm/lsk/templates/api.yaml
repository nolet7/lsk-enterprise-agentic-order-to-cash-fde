apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpEmail | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lsk-api
spec:
  replicas: {{ .Values.replicas }}
  selector: {matchLabels: {app: lsk-api}}
  template:
    metadata:
      labels: {app: lsk-api}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports: [{containerPort: 18474, name: http}]
        env:
        - {name: AUTH_MODE, value: {{ .Values.config.authMode | quote }}}
        - {name: OIDC_ISSUER, value: {{ .Values.config.oidcIssuer | quote }}}
        - {name: OIDC_AUDIENCE, value: {{ .Values.config.oidcAudience | quote }}}
        - {name: OIDC_JWKS_URL, value: {{ .Values.config.oidcJwksUrl | quote }}}
        - {name: ALLOWED_ORIGINS, value: {{ .Values.config.allowedOrigins | quote }}}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: {name: {{ .Values.config.databaseUrlSecret }}, key: DATABASE_URL}
        readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20}
        resources:
{{ toYaml .Values.resources | indent 10 }}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Service
metadata:
  name: lsk-api
spec:
  selector: {app: lsk-api}
  ports:
  - {port: 80, targetPort: 18474, name: http}
